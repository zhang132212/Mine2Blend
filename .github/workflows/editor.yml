name: Minecraft editor validation
on:
  push:
    branches: [editor, importer, exporter, mcp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-mcp.txt pillow==12.3.0 bpy==5.2.1
      - uses: actions/cache@v4
        with:
          path: test-output/mcmeta-26.2-assets.zip
          key: mcmeta-26.2-a4151022
      - run: python tools/fetch_resources.py
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: resources/converter/win-x64
      - run: node tools/bake_special_models.mjs
      - run: python -m unittest discover -s tests -v
      - run: python tests/blender_workflows.py
      - run: python tools/create_ctm_fixture.py
      - run: python tests/blender_ctm.py
      - run: python tests/blender_instances.py
      - run: python tests/blender_entities.py
      - run: python build_editor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            test-output/*report.json
            test-output/*preview.png
