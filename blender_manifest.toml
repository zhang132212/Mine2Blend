schema_version = "1.0.0"

id = "mcblock_mine2blend"
version = "0.7.0"
name = "Mine2Blend Editor Alpha"
tagline = "Minecraft BlockGrid editor with Litematic export and agent API"
maintainer = "MCBlock"
type = "add-on"
wheels = [
  "./wheels/litemapy-0.11.0b0-py3-none-any.whl",
  "./wheels/nbtlib-2.0.4-py3-none-any.whl",
  "./wheels/typing_extensions-4.16.0-py3-none-any.whl",
  "./wheels/mcschematic-11.4.4-py3-none-any.whl",
  "./wheels/immutable_views-0.6.1-py2.py3-none-any.whl",
]
website = "https://mcblock.top/blender"
tags = ["Import-Export"]
blender_version_min = "4.2.0"
license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 MCBlock",
]

[permissions]
files = "读写投影、资源包、预览图片和自动恢复文件"
network = "本地 Agent 桥通信及用户主动打开上游网站"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/*.zip",
  "/resources/converter/**/__pycache__/",
]
